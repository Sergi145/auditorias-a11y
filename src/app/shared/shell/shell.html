<a class="shell__skip-link" href="#contenido">Saltar al contenido principal</a>

<mat-sidenav-container class="shell">
  <mat-sidenav
    #drawer
    class="shell__nav"
    [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="isDesktop$ | async"
  >
    <mat-nav-list aria-label="Navegación principal">
      <a
        mat-list-item
        routerLink="/auditorias"
        routerLinkActive
        #auditoriasLink="routerLinkActive"
        [activated]="auditoriasLink.isActive"
      >
        <mat-icon matListItemIcon>fact_check</mat-icon>
        <span matListItemTitle>Auditorías</span>
      </a>
      <a
        mat-list-item
        routerLink="/biblioteca"
        routerLinkActive
        #bibliotecaLink="routerLinkActive"
        [activated]="bibliotecaLink.isActive"
      >
        <mat-icon matListItemIcon>library_books</mat-icon>
        <span matListItemTitle>Biblioteca de hallazgos</span>
      </a>
      <a
        mat-list-item
        routerLink="/componentes"
        routerLinkActive
        #componentesLink="routerLinkActive"
        [activated]="componentesLink.isActive"
      >
        <mat-icon matListItemIcon>widgets</mat-icon>
        <span matListItemTitle>Componentes</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <header>
      <mat-toolbar color="primary">
        @if (isHandset$ | async) {
          <button
            mat-icon-button
            type="button"
            aria-label="Abrir menú de navegación"
            (click)="drawer.toggle()"
          >
            <mat-icon>menu</mat-icon>
          </button>
        }
        <span class="shell__title">Auditorías A11y</span>
      </mat-toolbar>
    </header>

    <main class="shell__content" id="contenido">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
