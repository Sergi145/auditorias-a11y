<app-skip-link destino="#contenido">Saltar al contenido principal</app-skip-link>

<div class="flex min-h-full">
  <app-drawer
    [isHandset]="isHandset()"
    [opened]="abierto()"
    (openedChange)="onAbiertoChange($event)"
    label="Navegación principal"
  >
    <nav aria-label="Navegación principal">
      <ul class="m-0 flex list-none flex-col gap-1 p-0">
        <li>
          <a
            id="nav-principal-primer-enlace"
            routerLink="/auditorias"
            routerLinkActive
            #auditoriasLink="routerLinkActive"
            class="foco flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium"
            [class.bg-violet-50]="auditoriasLink.isActive"
            [class.text-violet-700]="auditoriasLink.isActive"
            [class.text-slate-700]="!auditoriasLink.isActive"
            [class.hover:bg-slate-100]="!auditoriasLink.isActive"
            (click)="onAbiertoChange(false)"
          >
            <app-icon name="clipboard-check" />
            Auditorías
          </a>
        </li>
        <li>
          <a
            routerLink="/biblioteca"
            routerLinkActive
            #bibliotecaLink="routerLinkActive"
            class="foco flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium"
            [class.bg-violet-50]="bibliotecaLink.isActive"
            [class.text-violet-700]="bibliotecaLink.isActive"
            [class.text-slate-700]="!bibliotecaLink.isActive"
            [class.hover:bg-slate-100]="!bibliotecaLink.isActive"
            (click)="onAbiertoChange(false)"
          >
            <app-icon name="book" />
            Biblioteca de hallazgos
          </a>
        </li>
        <li>
          <a
            routerLink="/componentes"
            routerLinkActive
            #componentesLink="routerLinkActive"
            class="foco flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium"
            [class.bg-violet-50]="componentesLink.isActive"
            [class.text-violet-700]="componentesLink.isActive"
            [class.text-slate-700]="!componentesLink.isActive"
            [class.hover:bg-slate-100]="!componentesLink.isActive"
            (click)="onAbiertoChange(false)"
          >
            <app-icon name="grid" />
            Componentes
          </a>
        </li>
      </ul>
    </nav>
  </app-drawer>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="sticky top-0 z-40 border-b border-slate-200 bg-white/95 backdrop-blur">
      <div class="flex items-center gap-3 px-4 py-3">
        @if (isHandset()) {
          <button
            #botonMenu
            type="button"
            appButton
            variant="icon"
            aria-label="Abrir menú de navegación"
            [attr.aria-expanded]="abierto()"
            (click)="alternar()"
          >
            <app-icon name="menu" />
          </button>
        }
        <span class="flex items-center gap-2 rounded-lg text-slate-900">
          <span class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-violet-700 text-white">
            <app-icon name="clipboard-check" />
          </span>
          <span class="shell__title text-lg font-semibold">Auditorías A11y</span>
        </span>
      </div>
    </header>

    <!--
      tabindex="-1" solo para poder enfocarlo por script (ver Shell,
      gestión de foco al navegar) — nunca se llega aquí con Tab, así que no
      necesita su propio anillo de foco visible; los controles reales de
      cada sección sí lo mantienen.
    -->
    <main #contenido class="mx-auto w-full max-w-[960px] flex-1 p-6 outline-none" id="contenido" tabindex="-1">
      <router-outlet />
    </main>

    <app-footer />
    <app-toast-host />
  </div>
</div>
