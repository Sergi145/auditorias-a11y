<a
  href="#contenido"
  class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[1000] focus:rounded focus:bg-white focus:px-4 focus:py-2 focus:text-slate-900 focus:outline focus:outline-2 focus:outline-violet-700"
>
  Saltar al contenido principal
</a>

<div class="flex h-full">
  <app-drawer
    [isHandset]="isHandset()"
    [opened]="abierto()"
    (openedChange)="onAbiertoChange($event)"
    label="Navegación principal"
  >
    <nav aria-label="Navegación principal">
      <ul class="m-0 flex list-none flex-col gap-1 p-0">
        <li>
          <a
            routerLink="/auditorias"
            routerLinkActive
            #auditoriasLink="routerLinkActive"
            class="foco flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium"
            [class.bg-violet-50]="auditoriasLink.isActive"
            [class.text-violet-700]="auditoriasLink.isActive"
            [class.text-slate-700]="!auditoriasLink.isActive"
            [class.hover:bg-slate-100]="!auditoriasLink.isActive"
          >
            <app-icon name="clipboard-check" />
            Auditorías
          </a>
        </li>
        <li>
          <a
            routerLink="/biblioteca"
            routerLinkActive
            #bibliotecaLink="routerLinkActive"
            class="foco flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium"
            [class.bg-violet-50]="bibliotecaLink.isActive"
            [class.text-violet-700]="bibliotecaLink.isActive"
            [class.text-slate-700]="!bibliotecaLink.isActive"
            [class.hover:bg-slate-100]="!bibliotecaLink.isActive"
          >
            <app-icon name="book" />
            Biblioteca de hallazgos
          </a>
        </li>
        <li>
          <a
            routerLink="/componentes"
            routerLinkActive
            #componentesLink="routerLinkActive"
            class="foco flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium"
            [class.bg-violet-50]="componentesLink.isActive"
            [class.text-violet-700]="componentesLink.isActive"
            [class.text-slate-700]="!componentesLink.isActive"
            [class.hover:bg-slate-100]="!componentesLink.isActive"
          >
            <app-icon name="grid" />
            Componentes
          </a>
        </li>
      </ul>
    </nav>
  </app-drawer>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="border-b border-slate-200">
      <div class="flex items-center gap-2 px-4 py-3">
        @if (isHandset()) {
          <button
            #botonMenu
            type="button"
            appButton
            variant="icon"
            aria-label="Abrir menú de navegación"
            (click)="alternar()"
          >
            <app-icon name="menu" />
          </button>
        }
        <span class="shell__title text-lg font-semibold text-slate-900">Auditorías A11y</span>
      </div>
    </header>

    <main class="mx-auto w-full max-w-[960px] flex-1 p-6" id="contenido">
      <router-outlet />
    </main>
  </div>
</div>

<app-toast-host />
