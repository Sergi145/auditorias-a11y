@if (pagina(); as pagina) {
  <h1 class="text-2xl font-semibold text-slate-900">Escaneo automático</h1>
  <p class="subtitulo">{{ pagina.nombre }} · {{ pagina.url }}</p>

  <app-tabs [tabs]="tabs" label="Método de escaneo" [(selectedIndex)]="tabIndex" />

  <div id="html-panel" role="tabpanel" aria-labelledby="html-tab" [hidden]="tabIndex() !== 0">
    <form class="formulario pt-4" [formGroup]="formularioHtml" (ngSubmit)="ejecutarEscaneo()">
      <app-form-field
        label="HTML de la página"
        #campoHtml="appFormField"
        [error]="
          formularioHtml.controls.html.invalid && formularioHtml.controls.html.touched
            ? 'Pega el HTML que quieres analizar.'
            : null
        "
      >
        <textarea
          appInput
          [id]="campoHtml.id"
          [attr.aria-describedby]="campoHtml.describedBy"
          formControlName="html"
          rows="8"
          placeholder="<html>...</html>"
        ></textarea>
      </app-form-field>
      <div class="formulario__acciones">
        <button appButton type="submit" [attr.aria-disabled]="escaneando() ? 'true' : null">
          <app-icon name="search" />
          {{ escaneando() ? 'Escaneando…' : 'Ejecutar escaneo' }}
        </button>
      </div>
    </form>
  </div>

  <div id="url-panel" role="tabpanel" aria-labelledby="url-tab" [hidden]="tabIndex() !== 1">
    <!-- Sin <form>/[formGroup]: no hay ningún valor de formulario que leer al
         escanear (la URL es fija, se lee de pagina().url), así que el botón
         solo dispara la acción — ver specs/12-escaneo-url.md. -->
    <div class="formulario pt-4">
      <app-form-field
        label="URL a escanear"
        hint="La URL se toma de esta página; para cambiarla, edita la página. El escaneo puede tardar hasta un minuto."
        #campoUrl="appFormField"
      >
        <input
          appInput
          [id]="campoUrl.id"
          [attr.aria-describedby]="campoUrl.describedBy"
          type="url"
          [value]="pagina.url"
          readonly
        />
      </app-form-field>
      <div class="formulario__acciones">
        <button
          appButton
          type="button"
          [attr.aria-disabled]="escaneando() ? 'true' : null"
          (click)="ejecutarEscaneoUrl()"
        >
          <app-icon name="search" />
          {{ escaneando() ? 'Escaneando…' : 'Ejecutar escaneo' }}
        </button>
      </div>
    </div>
  </div>

  <a appButton variant="text" [routerLink]="['/auditorias', auditoriaId, 'paginas', paginaId]">
    Volver al checklist
  </a>
} @else {
  <p>No se ha encontrado la página.</p>
}
