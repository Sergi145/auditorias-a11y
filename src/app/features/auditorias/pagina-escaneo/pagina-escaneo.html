@if (pagina(); as pagina) {
  <h1 class="text-2xl font-semibold text-slate-900">Escaneo automático</h1>
  <p class="subtitulo">{{ pagina.nombre }} · {{ pagina.url }}</p>

  <app-tabs [tabs]="tabs" label="Método de escaneo" [(selectedIndex)]="tabIndex" />

  <div id="html-panel" role="tabpanel" aria-labelledby="html-tab" [hidden]="tabIndex() !== 0">
    <form class="formulario pt-4" [formGroup]="formularioHtml" (ngSubmit)="ejecutarEscaneo()">
      <app-form-field label="HTML de la página" #campoHtml="appFormField">
        <textarea
          appInput
          [id]="campoHtml.id"
          [attr.aria-describedby]="campoHtml.describedBy"
          formControlName="html"
          rows="8"
          placeholder="<html>...</html>"
        ></textarea>
      </app-form-field>
      <div class="formulario__acciones">
        <button appButton type="submit">
          <app-icon name="search" />
          Ejecutar escaneo
        </button>
      </div>
    </form>
  </div>

  <div id="url-panel" role="tabpanel" aria-labelledby="url-tab" [hidden]="tabIndex() !== 1">
    <form class="formulario pt-4" [formGroup]="formularioUrl" (ngSubmit)="ejecutarEscaneo()">
      <app-form-field label="URL a escanear" #campoUrl="appFormField">
        <input
          appInput
          [id]="campoUrl.id"
          [attr.aria-describedby]="campoUrl.describedBy"
          type="url"
          formControlName="url"
        />
      </app-form-field>
      <div class="formulario__acciones">
        <button appButton type="submit">
          <app-icon name="search" />
          Ejecutar escaneo
        </button>
      </div>
    </form>
  </div>

  <p class="nota">
    <app-icon name="info" />
    Esta maqueta solo muestra el flujo de escaneo; el análisis real con axe-core llega en la
    rebanada 10-escaneo-axe.
  </p>

  <a appButton variant="text" [routerLink]="['/auditorias', auditoriaId, 'paginas', paginaId]">
    Volver al checklist
  </a>
} @else {
  <p>No se ha encontrado la página.</p>
}
