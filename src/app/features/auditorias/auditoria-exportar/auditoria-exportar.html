@if (auditoria(); as auditoria) {
  <h1 class="text-2xl font-semibold text-slate-900">Exportar informe</h1>
  <p class="subtitulo">{{ auditoria.nombre }} · {{ auditoria.cliente }}</p>

  <p class="pantalla__intro">Genera el informe de esta auditoría en el formato que necesites.</p>

  <div class="acciones">
    <button
      appButton
      type="button"
      class="w-full sm:w-auto"
      [attr.aria-disabled]="generando() === 'Excel' || sinDatosExportables() ? 'true' : null"
      [attr.aria-describedby]="sinDatosExportables() ? 'aviso-sin-datos' : null"
      (click)="exportar('Excel')"
    >
      <app-icon name="table" />
      {{ generando() === 'Excel' ? 'Generando…' : 'Exportar a Excel' }}
    </button>
    <button
      appButton
      variant="secondary"
      type="button"
      class="w-full sm:w-auto"
      [attr.aria-disabled]="generando() === 'PDF' || sinDatosExportables() ? 'true' : null"
      [attr.aria-describedby]="sinDatosExportables() ? 'aviso-sin-datos' : null"
      (click)="exportar('PDF')"
    >
      <app-icon name="document" />
      {{ generando() === 'PDF' ? 'Generando…' : 'Exportar a PDF' }}
    </button>
  </div>

  @if (sinDatosExportables()) {
    <p class="nota" id="aviso-sin-datos">
      <app-icon name="info" />
      {{ mensajeSinDatos() }}
    </p>
  }

  <a appButton variant="text" class="mt-4" [routerLink]="['/auditorias', auditoriaId]">Volver a la auditoría</a>
} @else {
  <p>No se ha encontrado la auditoría.</p>
}
