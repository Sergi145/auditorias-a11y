<h1 class="mb-6 text-2xl font-semibold text-slate-900">{{ titulo }}</h1>

<form class="formulario" [formGroup]="formulario" (ngSubmit)="enviar()">
  <app-form-field
    label="Nombre de la página"
    #campoNombre="appFormField"
    [error]="
      formulario.controls.nombre.invalid && formulario.controls.nombre.touched
        ? 'Introduce un nombre.'
        : null
    "
  >
    <input
      appInput
      #inputNombre
      [id]="campoNombre.id"
      [attr.aria-describedby]="campoNombre.describedBy"
      [attr.aria-invalid]="formulario.controls.nombre.invalid && formulario.controls.nombre.touched"
      formControlName="nombre"
      required
    />
  </app-form-field>

  <app-form-field
    label="URL"
    #campoUrl="appFormField"
    [error]="
      formulario.controls.url.invalid && formulario.controls.url.touched
        ? 'Introduce una URL válida (empieza por http:// o https://).'
        : null
    "
  >
    <input
      appInput
      #inputUrl
      [id]="campoUrl.id"
      [attr.aria-describedby]="campoUrl.describedBy"
      [attr.aria-invalid]="formulario.controls.url.invalid && formulario.controls.url.touched"
      type="url"
      formControlName="url"
      placeholder="https://ejemplo.org/pagina"
      required
    />
  </app-form-field>

  <app-form-field label="Notas generales" #campoNotas="appFormField">
    <textarea
      appInput
      [id]="campoNotas.id"
      [attr.aria-describedby]="campoNotas.describedBy"
      formControlName="notas_generales"
      rows="3"
    ></textarea>
  </app-form-field>

  <div class="formulario__acciones">
    <a appButton variant="text" [routerLink]="enlaceCancelar">Cancelar</a>
    <button appButton type="submit">{{ textoEnviar }}</button>
  </div>
</form>
