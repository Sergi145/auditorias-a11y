<app-skip-link destino="#contenido">Saltar al contenido principal</app-skip-link>

<header class="sticky top-0 z-40 border-b border-slate-200 bg-white/95 backdrop-blur">
  <div class="mx-auto flex max-w-[1180px] items-center justify-between gap-6 px-4 py-3 sm:px-6">
    <a
      routerLink="/bienvenida"
      class="foco flex items-center gap-2 rounded-lg text-slate-900 no-underline"
    >
      <span
        class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-violet-700 text-white"
      >
        <app-icon name="clipboard-check" />
      </span>
      <span class="text-lg font-semibold">Auditorías A11y</span>
    </a>

    <nav aria-label="Principal" class="hidden md:block">
      <ul class="m-0 flex list-none items-center gap-8 p-0">
        @for (enlace of enlaces; track enlace.ruta) {
          <li>
            <a
              [routerLink]="enlace.ruta"
              routerLinkActive=""
              ariaCurrentWhenActive="page"
              class="foco rounded-sm text-sm font-medium text-slate-700 hover:text-violet-700 hover:underline aria-[current=page]:font-semibold aria-[current=page]:text-violet-800 aria-[current=page]:underline"
            >
              {{ enlace.texto }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <button
      #botonMenu
      type="button"
      appButton
      variant="icon"
      class="md:hidden"
      aria-label="Abrir menú de navegación"
      [attr.aria-expanded]="menuAbierto()"
      (click)="alternarMenu()"
    >
      <app-icon name="menu" />
    </button>
  </div>
</header>

@if (isHandset()) {
  <app-drawer
    [isHandset]="true"
    [opened]="menuAbierto()"
    (openedChange)="onMenuAbiertoChange($event)"
    label="Navegación principal"
  >
    <nav aria-label="Principal">
      <ul class="m-0 flex list-none flex-col gap-1 p-0">
        @for (enlace of enlaces; track enlace.ruta) {
          <li>
            <a
              [routerLink]="enlace.ruta"
              routerLinkActive=""
              ariaCurrentWhenActive="page"
              (click)="onMenuAbiertoChange(false)"
              class="foco flex rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 aria-[current=page]:font-semibold aria-[current=page]:text-violet-800 aria-[current=page]:underline"
            >
              {{ enlace.texto }}
            </a>
          </li>
        }
      </ul>
    </nav>
  </app-drawer>
}

<main #contenido id="contenido" tabindex="-1" class="outline-none">
  <router-outlet />
</main>

<footer class="border-t border-slate-200">
  <div class="border-t border-slate-200 px-4 py-5 sm:px-6">
    <p class="mx-auto max-w-[1180px] text-xs text-slate-600">
      © 2026 Auditorías A11y. Proyecto personal, no afiliado a W3C/WAI.
    </p>
  </div>
</footer>
